name: Update market data and deploy
on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - '**.md'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-watch-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - run: python -m unittest discover -s tests -v
      - name: Commit fresh data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update closing prices and news'
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Prepare public site
        run: |
          mkdir -p public
          cp index.html style.css app.js public/
          cp -r data vendor public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
