name: Update market data and deploy
on:
  schedule:
    # Taipei times. GitHub often skips/delays scheduled runs (esp. at :00/:30), so use odd minutes and several retries after close.
    # TW close: 14:07, 14:37, 15:13, 16:23, 17:47, 19:11 Taipei
    - cron: '7 6 * * 1-5'
    - cron: '37 6 * * 1-5'
    - cron: '13 7 * * 1-5'
    - cron: '23 8 * * 1-5'
    - cron: '47 9 * * 1-5'
    - cron: '11 11 * * 1-5'
    # Evening news 20:17 Taipei
    - cron: '17 12 * * *'
    # US close: 05:43, 06:19, 07:29, 08:41 Taipei (Tue-Sat)
    - cron: '43 21 * * 1-5'
    - cron: '19 22 * * 1-5'
    - cron: '29 23 * * 1-5'
    - cron: '41 0 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'screenshots/**'
      - '**.md'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-watch-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh closing data (scheduled or manual)
        if: github.event_name != 'push'
        run: python scripts/update_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_worker.mjs
      - run: node tests/test_ui.mjs
      - run: python -m unittest discover -s tests -v
      - name: Commit fresh data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update closing prices and news'
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Prepare public site
        run: |
          mkdir -p public
          cp index.html style.css app.js public/
          cp -r data vendor public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
